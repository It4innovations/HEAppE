# slurm.conf - HEAppE CI Test Cluster Configuration
ClusterName=testcluster
SlurmctldHost=slurm-ci(127.0.0.1)

# Mail / Notifications
MailProg=/bin/true

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge

# Spool and Logs
SlurmctldPort=6817
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Scheduling & Process Tracking
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ProctrackType=proctrack/pgid
TaskPlugin=task/none
ReturnToService=2
SlurmUser=slurm

# Nodes & Partitions
NodeName=slurm-ci NodeAddr=127.0.0.1 CPUs=8 RealMemory=16384 Sockets=1 CoresPerSocket=8 ThreadsPerCore=1 State=UNKNOWN
PartitionName=standard Nodes=slurm-ci Default=YES MaxTime=INFINITE State=UP DefMemPerCPU=1024
PartitionName=debug Nodes=slurm-ci Default=NO MaxTime=01:00:00 State=UP DefMemPerCPU=512
