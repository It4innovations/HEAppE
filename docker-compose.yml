services:
  sshagent:
    image: "${DOCKER_REGISTRY-}sshagent"
    container_name: "${INSTANCE_NAME}_sshagent"
    build:
      context: .
      dockerfile: SshAgent/Dockerfile
    restart: unless-stopped
    volumes:
      - "${HOST_SSHAGENT_HOST_MAP_FOLD_PATH}:${HOST_SSHAGENT_CONTAINER_MAP_FOLD_PATH}"
      - app_volume:/app/shared
    environment:
      TZ: "UTC"
      SSH_AUTH_SOCK: "/app/shared/agentsocket"
    healthcheck:
      test: ["CMD-SHELL", "test -S /app/shared/agentsocket || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sshagent_internal_network
    profiles:
      - sshagent
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: "${INSTANCE_NAME}_mssql"
    restart: unless-stopped
    user: root
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$HOST_MSSQL_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$HOST_MSSQL_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - sql_volume:/var/opt/mssql
      - "${DATABASE_FULL_BACKUP_HOST_MAP_FOLD_NAME}:/opt/heappe/backups/database"
      - "${DATABASE_LOGS_BACKUP_HOST_MAP_FOLD_NAME}:/opt/heappe/backups/database/logs"
    ports:
      - "${HOST_MSSQL_PORT:-6000}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${HOST_MSSQL_PID:-Developer}"
      MSSQL_MEMORY_LIMIT_MB: "${HOST_MSSQL_MEMORY_LIMIT_MB:-4096}"
      TZ: "UTC"
      SA_PASSWORD: "${HOST_MSSQL_PASSWORD}"
    deploy:
      resources:
        limits:
          cpus: "${HOST_MSSQL_CPUS:-4}"
          memory: "${HOST_MSSQL_MEMORY:-6G}"
    networks:
      - db_internal_network
      - external_network
    profiles:
      - db
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  datastagingapi:
    image: "${DOCKER_REGISTRY-}datastagingapi"
    container_name: "${INSTANCE_NAME}_datastagingapi"
    entrypoint: ["dotnet", "DataStagingAPI.dll"]
    build:
      context: .
      dockerfile: DataStagingAPI/Dockerfile
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
        required: false
    volumes:
      - app_sftp_temp_volume:/sftp
      - app_volume:/app/shared
      - "${HOST_DATA_STAGING_HOST_MAP_FOLD_NAME}:${HOST_DATA_STAGING_CONTAINER_MAP_FOLD_PATH}"
    ports:
      - "${HOST_DATA_STAGING_PORT:-5001}:8080"
    environment:
      ASPNETCORE_RUNTYPE_ENVIRONMENT: "Docker"
      TZ: "UTC"
      OTEL_SERVICE_NAME: heappe[${OTEL_SERVICE_SUFFIX_ID:-0}]-datastagingapi
      OTEL_SDK_DISABLED: "${OTEL_DISABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:${OTEL_HOST_GRPC_PORT:-4317}
      CORECLR_ENABLE_PROFILING: "${OTEL_ENABLE_PROFILING:-0}"
    deploy:
      resources:
        limits:
          cpus: "${HOST_DATA_STAGING_CPUS:-2}"
          memory: "${HOST_DATA_STAGING_MEMORY:-2G}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger/index.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - db_internal_network
      - external_network
      - vaultNet
      - otelnet
    profiles:
      - staging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  heappe-init:
    image: busybox:1.37.0
    container_name: "${INSTANCE_NAME}_heappe-init"
    restart: "no"
    command: >
      sh -c '
        mkdir -p /opt/heappe/confs
        if [ -d /opt/heappe/confs/krb5.conf ]; then
          rmdir /opt/heappe/confs/krb5.conf 2>/dev/null || rm -rf /opt/heappe/confs/krb5.conf
        fi
        if [ ! -e /opt/heappe/confs/krb5.conf ]; then
          touch /opt/heappe/confs/krb5.conf
        fi
      '
    volumes:
      - "${HOST_APP_HOST_MAP_FOLD_NAME}:${HOST_APP_CONTAINER_MAP_FOLD_PATH}"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  heappe:
    image: "${DOCKER_REGISTRY-}heappe"
    container_name: "${INSTANCE_NAME}_heappe"
    entrypoint: ["dotnet", "RestApi.dll"]
    build:
      context: .
      dockerfile: RestApi/Dockerfile
    restart: unless-stopped
    depends_on:
      heappe-init:
        condition: service_completed_successfully
      mssql:
        condition: service_healthy
        required: false
    volumes:
      - app_sftp_temp_volume:/sftp
      - app_volume:/app/shared
      - vault-volume:/opt/vault-backup-access:ro
      - "${HOST_APP_HOST_MAP_FOLD_NAME}:${HOST_APP_CONTAINER_MAP_FOLD_PATH}"
      - "${HOST_KRB5_CONF_PATH:-./confs/krb5.conf}:/etc/krb5.conf:ro"
      - "${DATABASE_FULL_BACKUP_HOST_MAP_FOLD_NAME}:/opt/heappe/backups/database"
      - "${DATABASE_LOGS_BACKUP_HOST_MAP_FOLD_NAME}:/opt/heappe/backups/database/logs"
    ports:
      - "${HOST_APP_PORT:-5000}:80"
    environment:
      ASPNETCORE_RUNTYPE_ENVIRONMENT: "Docker"
      SSH_AUTH_SOCK: "/app/shared/agentsocket"
      TZ: "UTC"
      OTEL_SERVICE_NAME: heappe[${OTEL_SERVICE_SUFFIX_ID:-0}]
      OTEL_SDK_DISABLED: "${OTEL_DISABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:${OTEL_HOST_GRPC_PORT:-4317}
      CORECLR_ENABLE_PROFILING: "${OTEL_ENABLE_PROFILING:-0}"
    deploy:
      resources:
        limits:
          cpus: "${HOST_APP_CPUS:-4}"
          memory: "${HOST_APP_MEMORY:-4G}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/heappe/Health | grep -q '\"IsHealthy\":true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sshagent_internal_network
      - db_internal_network
      - external_network
      - vaultNet
      - otelnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  
  otel-collector-init:
    image: busybox:1.37.0
    container_name: "${INSTANCE_NAME}_otel-collector-init"
    command: sh -c "chown -R 10001:10001 /var/log/otel"
    volumes:
      - /var/log/otel:/var/log/otel
    profiles:
      - telemetry
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.151.0
    container_name: "${INSTANCE_NAME}_otel-collector"
    depends_on:
      otel-collector-init:
        condition: service_completed_successfully
    environment:
      OTEL_HOST_GRPC_PORT: "${OTEL_HOST_GRPC_PORT:-4317}"
    volumes:
      - ./otel-configs/otel-config.yaml:/etc/otel/config.yaml
      - /var/log/otel:/var/log/otel
    command: --config /etc/otel/config.yaml
    restart: unless-stopped
    ports:
      - "${OTEL_HOST_GRPC_PORT:-4317}:${OTEL_HOST_GRPC_PORT:-4317}"
    networks:
      - otelnet
    profiles:
      - telemetry
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.17.0
    container_name: "${INSTANCE_NAME}_jaeger"
    ports:
      - "${OTEL_JAEGER_CLIENT_PORT:-16686}:16686"
    networks:
      - otelnet
    profiles:
      - telemetry
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vault:
    image: hashicorp/vault:1.17.3
    container_name: "${INSTANCE_NAME}_vault"
    restart: unless-stopped
    ports:
      - "${HOST_VAULT_PORT:-8200}:8200"
    environment:
      VAULT_ADDR: "http://localhost:8200"
    volumes:
      - vault-volume:/vault
      - "${BASE_PATH}/vault/vault:/vault/config"
    command: server
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vaultNet
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vaultagent:
    image: hashicorp/vault:1.17.3
    container_name: "${INSTANCE_NAME}_vaultagent"
    restart: unless-stopped
    depends_on:
      - vault
    ports:
      - "${HOST_VAULT_AGENT_PORT:-8100}:8100"
    volumes:
      - vault-agent-volume:/vault/agent
      - "${BASE_PATH}/vault/agent:/vault/config"
      - ../app/logs/Vault/:/vault/logs
    command: proxy -config=/vault/config/vault-agent.hcl -log-level debug -log-file=/vault/logs/vault-agent.log
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8100/v1/sys/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - vaultNet
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vault_init:
    build:
      context: .
      dockerfile: ./HashiCorpVaultScripts/DockerVersion/Dockerfile
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME}
      VAULT_PASSWORD: ${VAULT_PASSWORD}
      SHARED_VAULT_FILE: ${SHARED_VAULT_FILE}
      SHARED_VAULT_FILE_NAME: ${SHARED_VAULT_FILE_NAME}
      BASE_PATH: ${BASE_PATH}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${VAULT_FILE_DIR_PATH}:/opt/ansibleVault/"
      - "${BASE_PATH}:/opt/confs/"
      - ${PWD}:/app
    networks:
      - vaultNet
    profiles:
      - initVault
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  vault_unseal:
    build:
      context: .
      dockerfile: ./HashiCorpVaultScripts/DockerVersion/Dockerfile
    restart: on-failure
    depends_on:
      - vault
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME}
      VAULT_PASSWORD: ${VAULT_PASSWORD}
      SHARED_VAULT_FILE: ${SHARED_VAULT_FILE}
      SHARED_VAULT_FILE_NAME: ${SHARED_VAULT_FILE_NAME}
      BASE_PATH: ${BASE_PATH}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${BASE_PATH}:/opt/confs/"
      - "${VAULT_FILE_DIR_PATH}:/opt/ansibleVault/"
      - ${PWD}:/app
    networks:
      - vaultNet
    command: /opt/unsealOrInitHVault.sh
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  app_volume:
  app_sftp_temp_volume:
  sql_volume:
  vault-volume:
  vault-agent-volume:

networks:
  external_network:
  sshagent_internal_network:
    internal: true
  db_internal_network:
    internal: true
  vaultNet:
    internal: true
  otelnet:
    driver: bridge
