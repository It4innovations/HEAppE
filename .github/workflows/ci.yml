name: HEAppE CI/CD Test & Coverage Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_dev_images:
        description: 'Build & push dev-latest container images to GHCR'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Multi-Container Test Infrastructure
        run: |
          cd ci
          docker compose -f docker-compose.ci.yml up -d --build mssql-ci slurm-ci sshnode-ci pbs-mock-ci qscheduler-ci

      - name: Wait for Services to become Healthy
        run: |
          cd ci
          chmod +x scripts/wait-for-healthy.sh
          ./scripts/wait-for-healthy.sh 120

      - name: Restore NuGet Packages
        run: |
          dotnet restore "HEAppE Core.sln"

      - name: Build HEAppE Solution
        run: |
          dotnet build "HEAppE Core.sln" -c Release -p:CI=true --no-restore

      - name: Execute Test Suites with Code Coverage
        id: test
        run: |
          dotnet test "HEAppE Core.sln" \
            -c Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --settings ci/coverage.runsettings \
            --logger "trx" \
            --logger "console;verbosity=normal" \
            --results-directory ./TestResults

      - name: Generate Code Coverage Reports (HTML & Cobertura)
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.8
        if: always()
        with:
          reports: 'TestResults/**/coverage.cobertura.xml'
          targetdir: 'TestResults/CoverageReport'
          reporttypes: 'Html;Cobertura;MarkdownSummary;Badges'
          assemblyfilters: '+RestApi;+BusinessLogicTier;+DataAccessTier;+ServiceTier;+CertificateGenerator;+DomainObjects;+ExtModels;+RestApiModels;+HpcConnectionFramework;+FileTransferFramework;+BackgroundThread;-*Test*;-*Tests*;-*.Migrations'

      - name: Publish Test Failures Summary to GitHub Step Summary
        if: always() && steps.test.outcome == 'failure'
        run: |
          echo "### ❌ Failed Test Cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import xml.etree.ElementTree as ET
          import glob

          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          found_failures = False

          for f in sorted(glob.glob('TestResults/**/*.trx', recursive=True)):
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  for res in root.findall('.//t:UnitTestResult[@outcome=\"Failed\"]', ns):
                      found_failures = True
                      test_name = res.get('testName', 'Unknown')
                      msg_elem = res.find('.//t:Message', ns)
                      trace_elem = res.find('.//t:StackTrace', ns)
                      msg = msg_elem.text.strip() if msg_elem is not None and msg_elem.text else ''
                      trace = trace_elem.text.strip() if trace_elem is not None and trace_elem.text else ''
                      print(f'#### 🔴 `{test_name}`\n')
                      if msg:
                          print(f'**Error:**\n\`\`\`\n{msg}\n\`\`\`\n')
                      if trace:
                          print(f'<details><summary>Stack Trace</summary>\n\n\`\`\`\n{trace}\n\`\`\`\n</details>\n')
              except Exception as e:
                  pass

          if not found_failures:
              print('_No individual test failures recorded in TRX files._\n')
          " >> $GITHUB_STEP_SUMMARY

      - name: Publish Code Coverage Summary to PR / Job Summary
        if: always() && steps.test.outcome != 'skipped'
        run: |
          if [ -f "TestResults/CoverageReport/Summary.md" ]; then
            cat TestResults/CoverageReport/Summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results Artifacts (TRX)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-trx
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload Code Coverage Artifacts (HTML & Cobertura)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: TestResults/CoverageReport
          if-no-files-found: warn

      - name: Teardown Docker Infrastructure
        if: always()
        run: |
          cd ci
          docker compose -f docker-compose.ci.yml down -v

  publish-dev-images:
    name: Build & Publish Development Images to GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/develop' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.build_dev_images == true)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Metadata
        id: meta
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          VERSION=$(awk '/^## /{sub(/^## [Vv]?/, ""); print; exit}' CHANGELOG.md | tr -d ' \r\n')
          if [ -z "$VERSION" ]; then
            VERSION="dev"
          fi
          
          echo "image_owner=${IMAGE_OWNER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build & Publish HEAppE Development Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./RestApi/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_owner }}/heappe:dev-latest
            ghcr.io/${{ steps.meta.outputs.image_owner }}/heappe:${{ steps.meta.outputs.version }}-dev
            ghcr.io/${{ steps.meta.outputs.image_owner }}/heappe:${{ steps.meta.outputs.branch }}
            ghcr.io/${{ steps.meta.outputs.image_owner }}/heappe:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.short_sha }}
