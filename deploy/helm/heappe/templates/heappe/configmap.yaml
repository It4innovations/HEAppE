apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heappe.fullname" . }}-api-config
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
data:
  appsettings.json: |
    {{- $settings := deepCopy .Values.api.appSettings }}
    {{ if .Values.vault.enabled }}
    {{- $_ := set $settings "VaultConnectorSettings" (dict "VaultBaseAddress" (include "heappe.vaultagent.address" .) "ClusterVaultAuthenticationCredentialsPath" "v1/HEAppE/data/ClusterAuthenticationCredentials" "ConnectionTimeoutInSeconds" 15) }}
    {{- end }}
    {{- $settings | toPrettyJson | nindent 4 }}
---
{{/*
  Seed data ConfigMap — supports three modes:
    1. api.seedData (string)          — raw njson string pasted directly
    2. api.seedDataObject (map)       — structured YAML that gets rendered to JSON
    3. api.existingSeedConfigMap       — name of a pre-existing ConfigMap
*/}}
{{- if or .Values.api.seedData .Values.api.seedDataObject }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heappe.fullname" . }}-api-seed
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.api.selectorLabels" . | nindent 4 }}
data:
  seed.njson: |
    {{- if .Values.api.seedDataObject }}
    {{- .Values.api.seedDataObject | toPrettyJson | nindent 4 }}
    {{- else if kindIs "string" .Values.api.seedData }}
    {{- .Values.api.seedData | nindent 4 }}
    {{- else }}
    {{- .Values.api.seedData | toPrettyJson | nindent 4 }}
    {{- end }}
{{- end }}

