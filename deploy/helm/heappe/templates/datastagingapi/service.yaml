apiVersion: v1
kind: Service
metadata:
  name: {{ include "heappe.fullname" . }}-datastaging
  labels:
    {{- include "heappe.labels" . | nindent 4 }}
    {{- include "heappe.datastaging.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.datastaging.service.type }}
  ports:
    - port: {{ .Values.datastaging.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "heappe.datastaging.selectorLabels" . | nindent 4 }}
