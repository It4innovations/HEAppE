# otelcol.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    #verbosity: detailed
  otlp/jaeger:
    endpoint: jaeger:4317 # The address of the Jaeger gRPC endpoint
    tls:
      insecure: true # Use TLS in production


service:
  #extensions: [jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/jaeger]