<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QScheduler OpenAPI Specification</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    html { box-sizing: border-box; overflow: -y-scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin:0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        spec: {
          "openapi": "3.0.3",
          "info": {
            "title": "QScheduler API",
            "description": "API specification for QScheduler - quantum task and session manager.",
            "version": "1.0.0"
          },
          "paths": {
            "/version": {
              "get": {
                "summary": "Get service version",
                "operationId": "getVersion",
                "responses": {
                  "200": {
                    "description": "Service version",
                    "content": {
                      "text/plain": {
                        "schema": {
                          "type": "string",
                          "example": "qscheduler v0.1.0"
                        }
                      }
                    }
                  }
                }
              }
            },
            "/tasks": {
              "post": {
                "summary": "Create and submit a task",
                "operationId": "createTask",
                "parameters": [
                  {
                    "name": "machine_id",
                    "in": "query",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int32"
                    },
                    "description": "Target machine identifier"
                  },
                  {
                    "name": "session_id",
                    "in": "query",
                    "required": false,
                    "schema": {
                      "type": "integer",
                      "format": "int64"
                    },
                    "description": "Optional session identifier"
                  }
                ],
                "requestBody": {
                  "description": "Raw task payload (e.g. JSON circuit payload or OpenQASM 3 string)",
                  "required": true,
                  "content": {
                    "application/octet-stream": {
                      "schema": {
                        "type": "string",
                        "format": "binary"
                      }
                    }
                  }
                },
                "responses": {
                  "201": {
                    "description": "Task created successfully. Returns the assigned QScheduler task ID.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "integer",
                          "format": "int64",
                          "example": 6
                        }
                      }
                    }
                  },
                  "400": {
                    "description": "Missing or invalid fields"
                  },
                  "422": {
                    "description": "Invalid machine_id, session_id, or target session is not running"
                  }
                }
              }
            },
            "/tasks/{id}": {
              "get": {
                "summary": "Get task state",
                "operationId": "getTask",
                "parameters": [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int64"
                    },
                    "description": "QScheduler Task ID"
                  }
                ],
                "responses": {
                  "200": {
                    "description": "Current task state",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/TaskStateResponse"
                        }
                      }
                    }
                  },
                  "404": {
                    "description": "Task not found"
                  }
                }
              }
            },
            "/sessions": {
              "post": {
                "summary": "Create a session",
                "operationId": "createSession",
                "parameters": [
                  {
                    "name": "machine_id",
                    "in": "query",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int32"
                    },
                    "description": "Target machine identifier"
                  },
                  {
                    "name": "time_limit_secs",
                    "in": "query",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int64"
                    },
                    "description": "Session time limit in seconds"
                  }
                ],
                "responses": {
                  "201": {
                    "description": "Session created successfully. Returns the assigned QScheduler session ID.",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "integer",
                          "format": "int64",
                          "example": 2
                        }
                      }
                    }
                  },
                  "400": {
                    "description": "Missing or invalid fields"
                  }
                }
              }
            },
            "/sessions/{id}": {
              "get": {
                "summary": "Get session state",
                "operationId": "getSession",
                "parameters": [
                  {
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int64"
                    },
                    "description": "QScheduler Session ID"
                  }
                ],
                "responses": {
                  "200": {
                    "description": "Current session state",
                    "content": {
                      "application/json": {
                        "schema": {
                          "$ref": "#/components/schemas/SessionStateResponse"
                        }
                      }
                    }
                  },
                  "404": {
                    "description": "Session not found"
                  }
                }
              }
            },
            "/machine/{machine_id}/arch": {
              "get": {
                "summary": "Get machine architecture",
                "description": "Returns the static quantum architecture layout of the machine.",
                "operationId": "getMachineArch",
                "parameters": [
                  {
                    "name": "machine_id",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int32"
                    },
                    "description": "Target machine identifier"
                  }
                ],
                "responses": {
                  "200": {
                    "description": "Architecture JSON representation",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "404": {
                    "description": "Machine not found"
                  },
                  "500": {
                    "description": "Backend error"
                  }
                }
              }
            },
            "/machine/{machine_id}/calibration/{calibration}/{endpoint}": {
              "get": {
                "summary": "Get machine calibration",
                "description": "Returns calibration metadata/data for the specified machine, calibration, and endpoint.",
                "operationId": "getMachineCalibration",
                "parameters": [
                  {
                    "name": "machine_id",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "integer",
                      "format": "int32"
                    },
                    "description": "Target machine identifier"
                  },
                  {
                    "name": "calibration",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "string"
                    },
                    "description": "Calibration name"
                  },
                  {
                    "name": "endpoint",
                    "in": "path",
                    "required": true,
                    "schema": {
                      "type": "string"
                    },
                    "description": "Target endpoint"
                  }
                ],
                "responses": {
                  "200": {
                    "description": "Calibration JSON representation",
                    "content": {
                      "application/json": {
                        "schema": {
                          "type": "string"
                        }
                      }
                    }
                  },
                  "404": {
                    "description": "Machine not found"
                  },
                  "500": {
                    "description": "Backend error"
                  }
                }
              }
            }
          },
          "components": {
            "schemas": {
              "TaskStateResponse": {
                "type": "object",
                "required": [
                  "state"
                ],
                "properties": {
                  "state": {
                    "type": "string",
                    "enum": [
                      "waiting",
                      "running",
                      "finished",
                      "failed",
                      "cancelled"
                    ],
                    "example": "finished"
                  },
                  "error": {
                    "type": "string",
                    "description": "Present only if state is 'failed'",
                    "example": "Cannot parse task body"
                  }
                }
              },
              "SessionStateResponse": {
                "type": "object",
                "required": [
                  "state"
                ],
                "properties": {
                  "state": {
                    "type": "string",
                    "enum": [
                      "waiting",
                      "open",
                      "closed"
                    ],
                    "example": "open"
                  }
                }
              }
            }
          }
        },
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
